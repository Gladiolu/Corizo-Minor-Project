<!DOCTYPE html>
<html>
    <head>
        <title>Edit Student</title>
    </head>
    <body>

    <h2>Edit Student</h2>

    <form method="post">

        <input type="text"
            name="name"
            value="{{ student.name }}"
            required>

        <input type="email"
            name="email"
            value="{{ student.email }}"
            required>

        <input type="text"
            name="course"
            value="{{ student.course }}"
            required>

        <button type="submit">
            Update
        </button>

    </form>

    <a href="/">Back</a>

    </body>
</html>
